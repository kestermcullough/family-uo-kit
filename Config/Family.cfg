# Family-friendly shard settings

# Wild creatures do not initiate combat. They can still defend themselves
# after being attacked, and controlled pets still obey attack commands.
PeacefulMobs=True

# Disable the login-time Magic Storm popup and forced town relocation.
MagicStormRelocation=False

# Automatically bond eligible player pets on taming/transfer and world load.
InstantPetBonding=True

# Allow mining while riding a mount.
MountedMining=True

# Keep player-owned pets maximally loyal, fed, and immune to abandonment.
PerfectPetCare=True

# Allow every skill to reach 120; apply to existing characters on load/login.
AllSkills120=True

# Multiply successful player skill gain amounts (not chance or stat gains).
SkillGainMultiplier=10
